[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskfraud-anomaly-detection"
version = "0.2.0"
description = "A reproducible synthetic-data anomaly ranking portfolio project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[project.scripts]
riskfraud = "riskfraud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
